

<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Login</title>

<link rel="stylesheet" href="css/styles.css">

<style>

body {

    margin: 0;

    padding: 0;

    font-family: Arial, sans-serif;

    background-image: url('https://images.unsplash.com/photo-1556740749-887f6717d7e4');

    background-size: cover;

    background-position: center;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

}

.overlay {

    position: absolute;

    width: 100%;

    height: 100%;

    background: rgba(0,0,0,0.6);

}

.login-container {

    position: relative;

    z-index: 2;

    width: 380px;

    padding: 40px;

    border-radius: 20px;

    background: rgba(255,255,255,0.1);

    backdrop-filter: blur(12px);

    color: white;

    box-shadow: 0 8px 30px rgba(0,0,0,0.5);

}

.login-container h1 {

    text-align: center;

    margin-bottom: 10px;

}

.login-container p {

    text-align: center;

    opacity: 0.8;

    margin-bottom: 30px;

}

.form-group {

    margin-bottom: 20px;

}

.form-group label {

    display: block;

    margin-bottom: 8px;

}

.form-group input {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

}

.password-container {

    position: relative;

}

.password-container button {

    position: absolute;

    right: 10px;

    top: 50%;

    transform: translateY(-50%);

    background: none;

    border: none;

    cursor: pointer;

    font-size: 18px;

}

.login-btn {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #00b894;

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition: 0.3s;

}

.login-btn:hover {

    background: #019875;

}

.footer {

    text-align: center;

    margin-top: 20px;

    opacity: 0.7;

}

</style>

</head>

<body>

<div class="overlay"></div>

<div class="login-container">

<h1>

Bebidas & Abarrotes

</h1>

<p>

Sistema Empresarial

</p>

<form id="loginForm">

<div class="form-group">

<label>Usuario</label>

<input
type="text"
id="usuario"
required
>

</div>

<div class="form-group">

<label>Contraseña</label>

<div class="password-container">

<input
type="password"
id="password"
required
>

<button
type="button"
onclick="togglePassword()"
>

👁️

</button>

</div>

</div>

<button
type="submit"
class="login-btn"
>

Iniciar Sesión

</button>

</form>

<div class="footer">

© 2026 Bebidas & Abarrotes S.A

</div>

</div>

<script src="js/auth.js"></script>

<script>

function togglePassword() {

    const passwordInput =
        document.getElementById(
            "password"
        );

    if (
        passwordInput.type === "password"
    ) {

        passwordInput.type = "text";

    } else {

        passwordInput.type = "password";

    }

}

</script>

</body>

</html>
