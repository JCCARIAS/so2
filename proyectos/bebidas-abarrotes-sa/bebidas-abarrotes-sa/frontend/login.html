```html
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bebidas & Abarrotes S.A</title>

    <link rel="stylesheet" href="css/styles.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background-image:
            linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?q=80&w=1974&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

        }

        .login-container{

            width:400px;

            padding:40px;

            border-radius:20px;

            backdrop-filter:blur(12px);

            background:rgba(255,255,255,0.1);

            border:1px solid rgba(255,255,255,0.2);

            box-shadow:0 8px 32px rgba(0,0,0,0.4);

            color:white;

        }

        .logo{

            text-align:center;
            margin-bottom:30px;

        }

        .logo h1{

            font-size:30px;
            margin-bottom:10px;

        }

        .logo p{

            color:#ddd;

        }

        .input-group{

            margin-bottom:20px;

        }

        .input-group label{

            display:block;
            margin-bottom:8px;
            font-size:14px;

        }

        .input-group input{

            width:100%;
            padding:14px;

            border:none;
            outline:none;

            border-radius:10px;

            background:rgba(255,255,255,0.15);

            color:white;

            font-size:16px;

        }

        .input-group input::placeholder{

            color:#ddd;

        }

        .password-container{

            position:relative;

        }

        .toggle-password{

            position:absolute;

            right:15px;
            top:50%;

            transform:translateY(-50%);

            cursor:pointer;

            color:white;

            font-size:14px;

        }

        .login-btn{

            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#00b894;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;

            margin-top:10px;

        }

        .login-btn:hover{

            background:#019875;

        }

        .footer{

            text-align:center;
            margin-top:20px;
            font-size:13px;
            color:#ccc;

        }

        @media(max-width:500px){

            .login-container{

                width:90%;
                padding:30px;

            }

        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">

            <h1>Bebidas & Abarrotes</h1>

            <p>Sistema Empresarial</p>

        </div>

        <form id="loginForm">

            <div class="input-group">

                <label>Usuario</label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese usuario"
                    required
                >

            </div>

            <div class="input-group">

                <label>Contraseña</label>

                <div class="password-container">

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingrese contraseña"
                        required
                    >

                    <span
                        class="toggle-password"
                        onclick="togglePassword()"
                    >
                        👁
                    </span>

                </div>

            </div>

            <button type="submit" class="login-btn">

                Iniciar Sesión

            </button>

        </form>

        <div class="footer">

            © 2026 Bebidas & Abarrotes S.A

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
```
