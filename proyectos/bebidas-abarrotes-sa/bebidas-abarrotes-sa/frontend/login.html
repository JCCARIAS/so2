<!DOCTYPE html>

<html lang="es">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Bebidas y Abarrotes SA</title>

<link rel="stylesheet" href="css/styles.css">

<style>

    body{
        margin:0;
        padding:0;
        font-family: Arial, Helvetica, sans-serif;
        background:#f4f6f9;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .login-container{
        background:white;
        padding:40px;
        width:350px;
        border-radius:12px;
        box-shadow:0 0 20px rgba(0,0,0,0.1);
    }

    .login-container h1{
        text-align:center;
        margin-bottom:30px;
        color:#1e293b;
    }

    .form-group{
        margin-bottom:20px;
    }

    .form-group label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
    }

    .form-group input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        font-size:16px;
        box-sizing:border-box;
    }

    .password-container{
        position:relative;
    }

    .toggle-password{
        position:absolute;
        right:10px;
        top:50%;
        transform:translateY(-50%);
        cursor:pointer;
        background:none;
        border:none;
        font-size:18px;
    }

    .login-btn{
        width:100%;
        padding:12px;
        background:#2563eb;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        cursor:pointer;
    }

    .login-btn:hover{
        background:#1d4ed8;
    }

</style>
```

</head>

<body>

```
<div class="login-container">

    <h1>Iniciar Sesión</h1>

    <form id="loginForm">

        <div class="form-group">
            <label>Usuario</label>
            <input
                type="text"
                id="usuario"
                required
            >
        </div>

        <div class="form-group">

            <label>Contraseña</label>

            <div class="password-container">

                <input
                    type="password"
                    id="password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword()"
                >
                    👁
                </button>

            </div>

        </div>

        <button type="submit" class="login-btn">
            Ingresar
        </button>

    </form>

</div>

<script src="js/auth.js"></script>
```

</body>

</html>
