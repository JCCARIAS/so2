    <div id="navbar-container"></div>

    <main class="main-content">

        <div class="container-fluid">

            <div class="mb-4">

                <h1 class="page-title">

                    Configuración

                </h1>

                <p class="page-subtitle">

                    Configuración general del sistema

                </p>

            </div>

            <div class="row g-4">

                <!-- PERFIL -->
                <div class="col-md-6">

                    <div class="table-container p-4">

                        <h4 class="mb-4">

                            Perfil Usuario

                        </h4>

                        <form id="formPerfil">

                            <div class="mb-3">

                                <label class="form-label">

                                    Nombre

                                </label>

                                <input type="text"
                                       class="form-control"
                                       value="Administrador">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Correo

                                </label>

                                <input type="email"
                                       class="form-control"
                                       value="admin@empresa.com">

                            </div>

                            <button class="btn btn-primary w-100">

                                Guardar Cambios

                            </button>

                        </form>

                    </div>

                </div>

                <!-- PASSWORD -->
                <div class="col-md-6">

                    <div class="table-container p-4">

                        <h4 class="mb-4">

                            Seguridad

                        </h4>

                        <form id="formPassword">

                            <div class="mb-3">

                                <label class="form-label">

                                    Nueva Contraseña

                                </label>

                                <input type="password"
                                       class="form-control">

                            </div>

                            <div class="mb-3">

                                <label class="form-label">

                                    Confirmar Contraseña

                                </label>

                                <input type="password"
                                       class="form-control">

                            </div>

                            <button class="btn btn-danger w-100">

                                Actualizar Contraseña

                            </button>

                        </form>

                    </div>

                </div>

            </div>

            <div class="row mt-4">

                            Preferencias del Sistema

                        </h4>

                        <div class="form-check form-switch mb-3">

                            <input class="form-check-input"
                                   type="checkbox"
                                   checked>

                            <label class="form-check-label">

                                Activar Notificaciones

                            </label>

                        </div>

                        <div class="form-check form-switch mb-3">

                            <input class="form-check-input"

                                Activar Modo Oscuro

                            </label>

                        </div>

                        <div class="form-check form-switch">

                            <input class="form-check-input"

                            <label class="form-check-label">

                                Mantenimiento del Sistema

                            </label>

                        </div>

                    </div>

                </div>

            </div>

        </div>
